<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" shape-rendering="crispEdges" font-family="'Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="stripes" width="40" height="10" patternUnits="userSpaceOnUse">
      <rect width="40" height="10" fill="#141c3d"/>
      <rect width="20" height="10" fill="#18224a"/>
    </pattern>
    <clipPath id="screen"><rect x="312" y="122" width="276" height="146"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- wall + floor -->
  <rect width="900" height="420" rx="18" fill="url(#stripes)"/>
  <rect y="340" width="900" height="80" fill="#4a2f1e"/>
  <g fill="#3b2415">
    <rect y="360" width="900" height="3"/><rect y="385" width="900" height="3"/>
    <rect x="150" y="340" width="3" height="20"/><rect x="520" y="363" width="3" height="22"/>
    <rect x="300" y="388" width="3" height="32"/><rect x="760" y="340" width="3" height="20"/>
  </g>

  <!-- window -->
  <rect x="56" y="66" width="178" height="158" fill="#8b5a2b"/>
  <rect x="66" y="76" width="75" height="64" fill="#38bdf8"/><rect x="149" y="76" width="75" height="64" fill="#38bdf8"/>
  <rect x="66" y="148" width="75" height="66" fill="#38bdf8"/><rect x="149" y="148" width="75" height="66" fill="#38bdf8"/>
  <rect x="180" y="92" width="26" height="26" fill="#facc15"/>
  <rect x="76" y="92" width="30" height="8" fill="#fff"/><rect x="84" y="86" width="16" height="6" fill="#fff"/>
  <rect x="44" y="224" width="202" height="10" fill="#6b4423"/>

  <!-- name sign -->
  <rect x="250" y="36" width="300" height="40" fill="#fdf2d0" stroke="#3b2a1a" stroke-width="3"/>
  <text x="400" y="64" font-size="22" font-weight="bold" text-anchor="middle" fill="#2b1d12">KSHITIJSHARMA6107</text>

  <!-- clock -->
  <circle cx="700" cy="76" r="28" fill="#fdf2d0" stroke="#1f2937" stroke-width="3"/>
  <rect x="698" y="56" width="4" height="22" fill="#1f2937"/>
  <rect x="698" y="74" width="16" height="4" fill="#1f2937"/>
  <rect x="699" y="52" width="2" height="26" fill="#ef4444">
    <animateTransform attributeName="transform" type="rotate" from="0 700 76" to="360 700 76" dur="60s" repeatCount="indefinite"/>
  </rect>

  <!-- lamp glow + lamp -->
  <polygon points="236,246 300,246 330,340 206,340" fill="url(#glow)"/>
  <rect x="236" y="294" width="42" height="8" fill="#374151"/>
  <rect x="254" y="236" width="6" height="58" fill="#4b5563"/>
  <polygon points="236,214 296,214 308,246 226,246" fill="#facc15"/>

  <!-- monitor -->
  <rect x="300" y="110" width="300" height="170" rx="6" fill="#1f2937"/>
  <rect x="312" y="122" width="276" height="146" fill="#0b1220"/>
  <g clip-path="url(#screen)" font-size="10" fill="#4ade80">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -144" dur="10s" repeatCount="indefinite"/>
      <g id="lines">
        <text x="320" y="136">$ git log --oneline</text>
        <text x="320" y="152">docker_documen: Initial commit</text>
        <text x="320" y="168">docker_documen: Add README for Docker</text>
        <text x="320" y="184">docker_documen: Update Docker Docs</text>
        <text x="320" y="200">LEETCODE_SOLLN: Add Medium C++ Sol</text>
        <text x="320" y="216">LEETCODE_SOLLN: Add Medium C++ Sol</text>
        <text x="320" y="232">LEETCODE_SOLLN: Add Medium C++ Sol</text>
        <text x="320" y="248">LEETCODE_SOLLN: Add Easy C++ Sol</text>
        <text x="320" y="264">$ _</text>
      </g>
      <use href="#lines" y="144"/>
    </g>
  </g>
  <rect x="440" y="280" width="20" height="20" fill="#374151"/>
  <rect x="405" y="298" width="90" height="6" fill="#4b5563"/>

  <!-- desk -->
  <rect x="200" y="302" width="500" height="14" fill="#8b5a2b"/>
  <rect x="200" y="316" width="500" height="4" fill="#6b4423"/>
  <rect x="222" y="320" width="14" height="22" fill="#6b4423"/>
  <rect x="664" y="320" width="14" height="22" fill="#6b4423"/>

  <!-- mug with steam -->
  <rect x="630" y="280" width="20" height="22" fill="#f8fafc"/><rect x="650" y="286" width="6" height="10" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <rect x="636" y="266" width="3" height="8" fill="#e2e8f0" opacity=".7"><animate attributeName="opacity" values=".1;.8;.1" dur="2.4s" repeatCount="indefinite"/></rect>
  <rect x="644" y="262" width="3" height="8" fill="#e2e8f0" opacity=".7"><animate attributeName="opacity" values=".8;.1;.8" dur="2.4s" repeatCount="indefinite"/></rect>

  <!-- chair -->
  <rect x="430" y="330" width="60" height="10" fill="#374151"/>
  <rect x="456" y="340" width="8" height="30" fill="#4b5563"/>
  <rect x="436" y="370" width="48" height="6" fill="#4b5563"/>

  <!-- plant -->
  <rect x="124" y="250" width="6" height="52" fill="#16a34a"/>
  <rect x="100" y="262" width="26" height="8" fill="#22c55e"/><rect x="128" y="246" width="30" height="8" fill="#22c55e"/>
  <rect x="108" y="282" width="18" height="8" fill="#4ade80"/><rect x="128" y="272" width="24" height="8" fill="#4ade80"/>
  <rect x="106" y="302" width="46" height="40" fill="#b4532a"/><rect x="100" y="302" width="58" height="8" fill="#c2603a"/>

  <!-- shelves + books (C++, Python) -->
  <rect x="730" y="206" width="150" height="8" fill="#8b5a2b"/>
  <rect x="730" y="272" width="150" height="8" fill="#8b5a2b"/>
  <rect x="744" y="160" width="26" height="46" fill="#ec4899"/>
  <rect x="772" y="172" width="20" height="34" fill="#2563eb"/>
  <rect x="794" y="166" width="22" height="40" fill="#f59e0b"/>
  <text x="757" y="188" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">C++</text>
  <text x="782" y="192" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">Py</text>
  <rect x="746" y="238" width="20" height="34" fill="#22c55e"/>
  <rect x="768" y="246" width="30" height="26" fill="#8b5cf6"/>

  <!-- cat -->
  <rect x="680" y="326" width="64" height="16" fill="#f59e0b"/>
  <rect x="738" y="316" width="22" height="26" fill="#f59e0b"/>
  <rect x="738" y="308" width="6" height="8" fill="#f59e0b"/><rect x="754" y="308" width="6" height="8" fill="#f59e0b"/>
  <rect x="746" y="322" width="3" height="3" fill="#1f2937"/><rect x="753" y="322" width="3" height="3" fill="#1f2937"/>
  <rect x="650" y="334" width="34" height="6" fill="#f59e0b">
    <animateTransform attributeName="transform" type="rotate" values="-10 684 337;12 684 337;-10 684 337" dur="2s" repeatCount="indefinite"/>
  </rect>

  <text x="880" y="408" font-size="9" text-anchor="end" fill="#94a3b8" opacity=".6">kshitijsharma6107</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
